<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XAU Trade Replay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23060606%22/%3E%3Crect%20x%3D%226%22%20y%3D%2220%22%20width%3D%2252%22%20height%3D%2230%22%20rx%3D%224%22%20fill%3D%22%2310b981%22%20fill-opacity%3D%22.25%22%20stroke%3D%22%2310b981%22%20stroke-width%3D%223%22/%3E%3Cline%20x1%3D%2223%22%20y1%3D%228%22%20x2%3D%2223%22%20y2%3D%2246%22%20stroke%3D%22%23ef4444%22%20stroke-width%3D%224%22/%3E%3Crect%20x%3D%2216%22%20y%3D%2214%22%20width%3D%2214%22%20height%3D%2224%22%20rx%3D%222%22%20fill%3D%22%23ef4444%22/%3E%3Cline%20x1%3D%2243%22%20y1%3D%2216%22%20x2%3D%2243%22%20y2%3D%2258%22%20stroke%3D%22%2310b981%22%20stroke-width%3D%224%22/%3E%3Crect%20x%3D%2236%22%20y%3D%2226%22%20width%3D%2214%22%20height%3D%2224%22%20rx%3D%222%22%20fill%3D%22%2310b981%22/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#060606;--panel:#0c0c0d;--card:#111113;--line:#1f1f23;--tx:#e4e4e7;--mute:#71717a;--win:#10b981;--loss:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit}.num{font-variant-numeric:tabular-nums}.w{color:var(--win)}.l{color:var(--loss)}.m{color:var(--mute)}.wr{color:var(--warn)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 0 3px #10b98122}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:6px;font-weight:600;color:var(--mute);font-size:12px}
.seg button:hover{color:var(--tx)}.seg button.on{background:#10b98122;color:var(--win)}
.btn{all:unset;cursor:pointer;padding:7px 14px;border-radius:8px;background:var(--win);color:#04130d;font-weight:700;font-size:12px}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 12px;min-width:80px}
.stat small{display:block;color:var(--mute);font-size:11px}.stat b{font-size:14px}
.sp{flex:1}
.view{flex:1;display:none;min-height:0}.view.on{display:flex}
/* ---- chart view ---- */
#wrap{flex:1;position:relative;min-width:0}#chart{position:absolute;inset:0}
#ov{position:absolute;inset:0;pointer-events:none;z-index:3}
#legend{position:absolute;left:12px;top:10px;z-index:4;font-size:12px;pointer-events:none}
#card{position:absolute;left:12px;top:40px;z-index:4;background:#131315f2;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:240px;display:none;backdrop-filter:blur(6px)}
#card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:12px}
#card table{border-collapse:collapse;width:100%}#card td{padding:2px 0}#card td:last-child{text-align:right}
#card .pl{font-size:18px;font-weight:700;margin-top:6px}
#card .x{all:unset;cursor:pointer;color:var(--mute);font-size:16px}
#tip{position:absolute;z-index:5;background:#18181bf2;border:1px solid #2a2a2e;padding:7px 10px;border-radius:8px;pointer-events:none;display:none;white-space:nowrap;font-size:12px}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.4px}
.tag.buy{background:#10b98122;color:var(--win)}.tag.sell{background:#ef444422;color:var(--loss)}
.flag{font-size:10px;padding:1px 6px;border-radius:4px;background:#f59e0b1f;color:var(--warn);margin-left:4px;white-space:nowrap}
aside{width:320px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--mute)}
.chip.on{border-color:#10b98166;color:var(--win);background:#10b98114}
#count{margin-left:auto;align-self:center;font-size:11px}
#list{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #161618;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:#141416}.row.on{background:#10b98110;border-left-color:var(--win)}
.row small{display:block;color:var(--mute);font-size:11px}.row .pl{text-align:right;font-weight:600}
.live{font-size:10px;color:#fbbf24;margin-left:4px}
.hint{padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}
/* ---- performance view ---- */
#perf{overflow:auto;display:none}#perf.on{display:block}
.pw{max-width:1240px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.box h3{margin:0 0 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.box h3 small{font-weight:400;color:var(--mute)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi small{display:block;color:var(--mute);font-size:11px}.kpi b{font-size:20px;display:block}.kpi i{font-style:normal;font-size:11px}
.verdict{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.verdict li{padding:8px 12px;border-radius:8px;background:#0a0a0b;border:1px solid var(--line)}
.verdict li b{margin-right:6px}
table.t{width:100%;border-collapse:collapse}table.t th{font-weight:600;color:var(--mute);font-size:11px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:7px 8px;border-bottom:1px solid #18181b}table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#151517}
.tscroll{overflow-x:auto}
.br{display:grid;grid-template-columns:92px 1fr 72px 44px 30px;gap:8px;align-items:center;padding:4px 0;font-size:12px}
.br .bar{height:8px;background:#18181b;border-radius:4px;position:relative;overflow:hidden}
.br .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.br span:not(:first-child){text-align:right}
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}.heat .wk{display:grid;grid-template-rows:14px repeat(7,14px);gap:3px}
.heat .d{width:14px;height:14px;border-radius:3px;background:#161618}.heat .ml{font-size:10px;color:var(--mute);white-space:nowrap;height:14px}
.heat .dl{display:grid;grid-template-rows:14px repeat(7,14px);gap:3px;font-size:10px;color:var(--mute);margin-right:4px}
#eq{height:260px;position:relative}
.mbars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.mbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;gap:4px}
.mbars i{width:100%;max-width:56px;border-radius:5px 5px 0 0;min-height:2px}
.cap{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.cap i{display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;color:#04130d;font-weight:700}
/* modal */
#modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .mb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:96vh;display:flex;flex-direction:column;gap:12px}
#modal .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#modal select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
#modal img{width:100%;border-radius:10px;border:1px solid var(--line);object-fit:contain;min-height:0;flex:1}
@media(max-width:1640px){.stat.o1{display:none}}@media(max-width:1480px){.stat.o2{display:none}}
@media(max-width:900px){.c8,.c6,.c4{grid-column:span 12}}
@media(max-width:820px){.view.on#vchart{flex-direction:column}aside{width:auto;height:38vh;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header>
 <div class="brand"><i></i><span id="brand"></span></div>
 <div class="seg" id="views"><button data-v="chart" class="on" data-en="Chart">กราฟ</button><button data-v="perf">Performance</button></div>
 <div class="seg" id="tf"><button data-tf="M15">15m</button><button data-tf="H1" class="on">1H</button><button data-tf="H4">4H</button><button data-tf="D1">1D</button></div>
 <div class="sp"></div>
 <div class="stats" id="stats"></div>
 <div class="seg" id="mode" title="โหมด % ซ่อนตัวเลขเงินทั้งหมด ไว้แคปให้คนอื่นดู" data-en-title="% mode hides all dollar amounts for sharing"><button data-m="$" class="on" data-en="$ real">$ จริง</button><button data-m="%" data-en="% only">% อย่างเดียว</button></div>
 <div class="seg" id="lang"><button data-l="th">TH</button><button data-l="en">EN</button></div>
 <button class="btn" id="exp">Export PNG</button>
</header>

<div class="view on" id="vchart">
 <div id="wrap"><div id="chart"></div><canvas id="ov"></canvas><div id="legend" class="num"></div><div id="card"></div><div id="tip"></div></div>
 <aside>
  <div class="filters" id="filters">
   <button class="chip on" data-f="all" data-en="All">ทั้งหมด</button><button class="chip" data-f="win" data-en="Wins">กำไร</button><button class="chip" data-f="loss" data-en="Losses">ขาดทุน</button>
   <button class="chip" data-f="buy">Buy</button><button class="chip" data-f="sell">Sell</button><button class="chip" data-f="flag" data-en="⚠ Flagged">⚠ ติดธง</button><span id="count" class="m"></span>
  </div>
  <div id="list"></div>
  <div class="hint"><span data-en="Click a box or row to zoom · Esc clear · ↑↓ step trades · data as of">คลิกกล่องบนกราฟหรือรายการเพื่อซูม · Esc ยกเลิก · ↑↓ เลื่อนไม้ · ข้อมูล ณ</span> <span class="built"></span> (<span class="tzl"></span>)</div>
 </aside>
</div>

<div class="view" id="perf"><div class="pw" id="pw"></div></div>

<div id="modal"><div class="mb">
 <div class="ctl"><b style="font-size:14px" data-en="Export report image">Export รูปรายงาน</b><div class="sp"></div>
  <select id="period"></select>
  <div class="seg" id="mode2"><button data-m="$" data-en="$ real">$ จริง</button><button data-m="%" data-en="% only">% อย่างเดียว</button></div></div>
 <img id="prev" alt="preview">
 <div class="ctl"><span class="m" style="font-size:11px" data-en="1080×1350 · IG/FB post size">1080×1350 · ขนาดโพสต์ IG/FB</span><div class="sp"></div><button class="btn ghost" id="mclose" data-en="Close">ปิด</button><button class="btn" id="dl" data-en="Download PNG">ดาวน์โหลด PNG</button></div>
</div></div>

<script>
/*DATA*/
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const fmt=(n,d=2)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(n,d=2)=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n),d), cls=n=>n>0?'w':n<0?'l':'m';
let LANG='th';try{LANG=localStorage.getItem('xau-lang')||'th'}catch(e){}
const tx=(th,en)=>LANG==='en'?en:th; // ข้อความ 2 ภาษา
const WD={th:['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
const MN={th:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
let TH=WD[LANG]||WD.th,MO=MN[LANG]||MN.th;
const D=t=>new Date(t*1000),pad=n=>String(n).padStart(2,'0');
const dts=t=>{const d=D(t);return `${TH[d.getUTCDay()]} ${d.getUTCDate()}/${d.getUTCMonth()+1} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`};
const dur=s=>{const h=s/3600;return h<1?Math.round(h*60)+tx(' นาที',' min'):h<48?h.toFixed(1)+tx(' ชม.',' h'):(h/24).toFixed(1)+tx(' วัน',' d')};
const mkey=t=>{const d=D(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)},mname=k=>MO[+k.slice(5)-1]+' '+(LANG==='en'?k.slice(0,4):+k.slice(0,4)+543-2500);
const dkey=t=>D(t).toISOString().slice(0,10);
$$('.built').forEach(e=>e.textContent=BUILT);
const TZ=+(ACCT.tz??7),TZL='UTC'+(TZ>=0?'+':'')+TZ;$$('.tzl').forEach(e=>e.textContent=TZL);
let MODE='$';try{MODE=localStorage.getItem('xau-mode')||'$'}catch(e){}

// ================= คำนวณ =================
const DIR=t=>t.side==='buy'?1:-1, mv=t=>(t.exit-t.entry)*DIR(t), ppt=t=>t.vol*ACCT.csize;
const CLOSED=TRADES.filter(t=>!t.open).sort((a,b)=>a.t1-b.t1), OPEN=TRADES.filter(t=>t.open);
// % = เทียบยอดฝากรวม ไม่ทบต้น (ยิง lot ตายตัว -> TWR ใช้ไม่ได้ เพราะ balance แกว่งจากการโอนเข้า/ออก)
const BASE=Math.max(1,CASH.filter(c=>c.amt>0).reduce((a,c)=>a+c.amt,0)); // ฐาน % = ยอดฝากเข้ารวม (คิดอัตโนมัติ)
const calcAP=()=>TRADES.forEach(t=>{t.ap=t.profit/BASE*100});calcAP();
const BIG=0.5; // ขาดทุนเกินกี่ % ของราคาทอง โดยไม่โดน SL = หลุดไม่มีเบรก
const pp=(x,t)=>x/t.entry*100; // ระยะราคา -> % ของราคาทอง
// ธงวินัย
for(const t of TRADES){t.flags=[];
 if(t.vol>ACCT.maxLot+1e-9)t.flags.push('lot');
 if(!t.open&&-pp(mv(t),t)>BIG&&!/\[sl/i.test(t.comment||''))t.flags.push('nosl');
 if(TRADES.some(o=>o!==t&&o.side===t.side&&o.t0<t.t0&&o.t1>t.t0&&(t.entry-o.entry)*DIR(t)<0))t.flags.push('avg');
 if(CLOSED.some(o=>o.profit<0&&o.t1<=t.t0&&t.t0-o.t1<=1800))t.flags.push('rev');}
const FL=f=>({lot:tx('lot เกิน','Oversized lot'),nosl:tx('หลุดไม่มีเบรก','No-brake loss'),avg:tx('ถัวขาดทุน','Averaging down'),rev:tx('แก้มือ ≤30น.','Revenge ≤30m')})[f];
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0), avg=(a,f)=>a.length?sum(a,f)/a.length:0;
const $M=(d,p,dd=2)=>MODE==='$'?(d<0?'−$':'$')+fmt(Math.abs(d),dd):sg(p)+'%';   // เงินหรือ % ตามโหมด
const $Ms=(d,p)=>MODE==='$'?(d>0?'+':d<0?'−':'')+'$'+fmt(Math.abs(d)):sg(p)+'%';

function stats(L){ // L = ไม้ปิดแล้ว เรียงตามเวลาปิด
 const n=L.length,W=L.filter(t=>t.profit>0),Lo=L.filter(t=>t.profit<=0),gw=sum(W,t=>t.profit),gl=-sum(Lo,t=>t.profit);
 let c=0,pc=0,dd$=0,sw=0,sl=0,mw=0,ml=0;
 for(const t of L){c+=t.profit;pc=Math.max(pc,c);dd$=Math.min(dd$,c-pc);
  if(t.profit>0){sw++;sl=0;mw=Math.max(mw,sw)}else{sl++;sw=0;ml=Math.max(ml,sl)}}
 const aw=avg(W,t=>t.profit),al=-avg(Lo,t=>t.profit),Wm=W.filter(t=>t.mfe>0);
 const r={n,w:W.length,wr:n?W.length/n*100:0,net:gw-gl,netP:(gw-gl)/BASE*100,pf:gl?gw/gl:(gw?Infinity:0),payoff:al?aw/al:0,aw,al,
  awP:avg(W,t=>t.ap),alP:-avg(Lo,t=>t.ap),exp:n?(gw-gl)/n:0,expP:avg(L,t=>t.ap),dd$,ddP:dd$/BASE*100,
  holdW:avg(W,t=>t.t1-t.t0),holdL:avg(Lo,t=>t.t1-t.t0),streakW:mw,streakL:ml,
  best:L.reduce((b,t)=>!b||t.profit>b.profit?t:b,null),worst:L.reduce((b,t)=>!b||t.profit<b.profit?t:b,null),
  be:L.filter(t=>Math.abs(t.pct)<0.05).length,cap:Wm.length?avg(Wm,t=>Math.min(1,mv(t)/t.mfe))*100:0,
  left:sum(L.filter(t=>t.mfe!=null),t=>Math.max(0,t.mfe-mv(t))*ppt(t)),leftP:0};r.leftP=r.left/BASE*100;return r;
}
let ALL=stats(CLOSED);
const MONTHS=[...new Set(CLOSED.map(t=>mkey(t.t1)))];

// ================= header =================
function renderHeader(){
 const fl=sum(OPEN,t=>t.profit),flP=sum(OPEN,t=>t.ap);
 $('#stats').innerHTML=[[tx('ไม้ปิดแล้ว','Closed'),ALL.n,'o2'],['Winrate',ALL.wr.toFixed(0)+'%'],[MODE==='$'?'Net':tx('ผลตอบแทน','Return'),`<span class="${cls(ALL.net)}">${$Ms(ALL.net,ALL.netP)}</span>`],
  ['Profit factor',ALL.pf.toFixed(2),'o1'],['Payoff',ALL.payoff.toFixed(2),'o1'],...(OPEN.length?[[tx('ลอยอยู่','Floating'),`<span class="${cls(fl)}">${$Ms(fl,flP)}</span>`]]:[])]
  .map(([k,v,o=''])=>`<div class="stat num ${o}"><small>${k}</small><b>${v}</b></div>`).join('');
}

// ================= กราฟ =================
const chart=LightweightCharts.createChart($('#chart'),{layout:{background:{color:'#060606'},textColor:'#8b8b93',fontFamily:'Segoe UI, Tahoma, sans-serif'},
 grid:{vertLines:{color:'#111113'},horzLines:{color:'#111113'}},rightPriceScale:{borderColor:'#1f1f23'},
 timeScale:{borderColor:'#1f1f23',timeVisible:true,rightOffset:10},autoSize:true,
 crosshair:{mode:0,vertLine:{color:'#3f3f46',labelBackgroundColor:'#27272a'},horzLine:{color:'#3f3f46',labelBackgroundColor:'#27272a'}}});
const cs=chart.addCandlestickSeries({upColor:'#10b981',downColor:'#ef4444',borderVisible:false,wickUpColor:'#10b981',wickDownColor:'#ef4444',priceLineColor:'#a1a1aa'});
let TF='H1',bars=[];
function barAt(t){let lo=0,hi=bars.length-1;if(t<bars[0].time)return 0;while(lo<hi){const mid=(lo+hi+1)>>1;bars[mid].time<=t?lo=mid:hi=mid-1}return lo}
function setTF(tf,keep=true){
 const vr=keep&&bars.length?chart.timeScale().getVisibleRange():null;
 TF=tf;bars=BARS[tf].map(([time,open,high,low,close])=>({time,open,high,low,close}));cs.setData(bars);
 cs.setMarkers(TRADES.map(t=>({time:bars[barAt(t.t0)].time,position:t.side==='buy'?'belowBar':'aboveBar',
  color:t.side==='buy'?'#10b981':'#ef4444',shape:t.side==='buy'?'arrowUp':'arrowDown'})).sort((a,b)=>a.time-b.time));
 $$('#tf button').forEach(b=>b.classList.toggle('on',b.dataset.tf===tf));
 if(vr)chart.timeScale().setVisibleRange(vr);legend();draw();
}
function legend(p){const b=p&&p.seriesData&&p.seriesData.get(cs)||bars[bars.length-1];if(!b)return;const ch=b.close-b.open,c=ch>=0?'w':'l';

 g.beginPath();pts.forEach((v,k)=>k?g.lineTo(X(k),Y(v)):g.moveTo(X(k),Y(v)));g.strokeStyle=G;g.lineWidth=4;g.lineJoin='round';g.stroke();
