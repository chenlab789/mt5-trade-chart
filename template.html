<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#14161a;--mute:#4b5260;--line:#e3e5ea;--soft:#f8f9fb;--soft2:#f1f2f5;--track:#eef0f3;
 --blue:#2b59c3;--bluebg:#eaf0fb;--win:#0a8f5a;--winbg:#e6f4ee;--loss:#c23b3b;--lossbg:#fbeaea;--warn:#b36b00;--warnbg:#fff6e6;--warntx:#8a5a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Anuphan,"Segoe UI",Tahoma,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}.w{color:var(--win)}.l{color:var(--loss)}.m{color:var(--mute)}.wr{color:var(--warn)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,143,90,.45)}70%{box-shadow:0 0 0 8px rgba(10,143,90,0)}100%{box-shadow:0 0 0 0 rgba(10,143,90,0)}}
@keyframes pulseW{0%{box-shadow:0 0 0 0 rgba(179,107,0,.45)}70%{box-shadow:0 0 0 8px rgba(179,107,0,0)}100%{box-shadow:0 0 0 0 rgba(179,107,0,0)}}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s both}
.lift{transition:transform .18s ease,box-shadow .18s ease}.lift:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,22,26,.07)}
header{position:sticky;top:0;z-index:10;min-height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:8px 28px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo b{width:28px;height:28px;border-radius:8px;background:var(--blue);display:grid;place-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;color:var(--mute);font-weight:500;transition:background .2s,color .2s}
.tabs button:hover{color:var(--tx)}.tabs button.on{background:var(--bluebg);color:var(--blue);font-weight:600}
.tabs button{display:flex;flex-direction:column;line-height:1.25;padding:6px 14px;font-size:15px}.tabs button small{font-size:11px;font-weight:400;color:var(--mute)}.tabs button.on small{color:#3d5a9e}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}.badge.g{background:var(--winbg);color:var(--win)}.badge.o{background:var(--warnbg);color:var(--warntx)}.badge.b{background:var(--lossbg);color:var(--loss)}
.info{display:inline-flex;width:16px;height:16px;border-radius:50%;border:1px solid #b9bfca;font-size:10px;font-style:normal;align-items:center;justify-content:center;margin-left:4px;cursor:help;color:var(--mute)}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}.money>div{padding:14px;border-radius:10px;background:var(--soft)}.money small{font-size:13px;color:var(--mute)}.money b{display:block;font-size:22px;font-weight:700;margin-top:2px}.money i{font-style:normal;font-size:12px;color:var(--mute)}
.money .real{background:var(--winbg);border:1px solid #bfe3cf}
.cashl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 24px;margin-top:14px;border-top:1px solid var(--soft2);padding-top:8px}.cashl div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--soft2)}
.trcol{flex:999 1 640px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hero{background:#161a22;color:#fff;border-radius:14px;padding:20px 24px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center}.hero small{color:#b9c0cc;font-size:13px}
.flagrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 120px;gap:4px 16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-top:8px}.flagrow span{text-align:right}
.flagrow.bad{background:#fdf3f2;border-color:#f0c9c3}.flagrow.ok{background:var(--winbg);border-color:#c4e4d3}
table.t tr.sub td{font-size:11px;color:var(--mute);background:var(--soft);padding:4px 8px}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);background:var(--bg);padding:6px 12px;border-radius:999px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--win);animation:pulse 2s infinite}.dot.busy{background:var(--warn);animation:pulseW 1.2s infinite}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;font-size:12px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:6px;color:var(--mute);transition:background .2s}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{all:unset;cursor:pointer;height:38px;padding:0 18px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.wrap{max-width:1392px;margin:0 auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.acct{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.acct.on{border:2px solid var(--blue);padding:11px 15px}
.acct small{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}.acct b{font-size:16px}.acct span{font-size:13px;font-weight:600}
.bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0}
.kpi{padding:16px 18px}.kpi small{display:block;font-size:13px;color:var(--mute)}.kpi b{display:block;font-size:30px;font-weight:700;line-height:1.25}.kpi i{font-style:normal;font-size:12px;color:var(--mute)}
.row2{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch}
.chartcard{flex:999 1 640px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.chhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#wrap{position:relative;height:420px;transition:height .35s ease}#wrap.big{height:max(560px,calc(100vh - 330px))}
#chart{position:absolute;inset:0}#ov{position:absolute;inset:0;pointer-events:none;z-index:3}
#legend{position:absolute;left:10px;top:8px;z-index:4;font-size:12px;pointer-events:none}
#tip{position:absolute;z-index:5;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.08);padding:7px 10px;border-radius:8px;pointer-events:none;display:none;white-space:nowrap;font-size:12px}
.side{flex:1 1 360px;display:flex;flex-direction:column;min-width:0}
.side h3,.card h3{margin:0;font-size:15px;font-weight:700}
.shead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.link{all:unset;cursor:pointer;font-size:12px;color:var(--blue);font-weight:600}
.dayh{padding:7px 16px 5px;font-size:12px;font-weight:600;color:var(--mute);background:var(--soft);border-top:1px solid var(--track);display:flex;justify-content:space-between}
.tr{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--soft2);transition:background .15s}
.tr:hover{background:#f6f8fc}.tr.on{background:#eef3fc}
.tr .px{flex:1;min-width:0}.tr .px b{display:block;font-size:13px;font-weight:500}.tr .px small{display:block;font-size:12px;color:var(--mute)}
.tr .pl{text-align:right}.tr .pl b{display:block;font-weight:700;font-size:15px}.tr .pl small{font-size:11px;color:var(--mute)}
.tag{font-size:11px;font-weight:700;width:42px;text-align:center;padding:4px 0;border-radius:6px;flex:none}
.tag.buy{color:var(--win);background:var(--winbg)}.tag.sell{color:var(--loss);background:var(--lossbg)}
.flag{font-size:11px;background:var(--warnbg);color:var(--warntx);padding:2px 9px;border-radius:999px;white-space:nowrap}
.live{font-size:11px;color:var(--warn);font-weight:600}
.scroll{overflow:auto}
.detail{padding:20px;display:flex;flex-direction:column;gap:14px;animation:slidein .35s both}
.detail .big{font-size:40px;font-weight:700;line-height:1.15}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid var(--track);padding-top:14px}
.dgrid small{display:block;font-size:12px;color:var(--mute)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:13px;background:var(--bg);color:var(--mute);transition:background .2s,color .2s}
.filters button.on{background:var(--tx);color:#fff}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
.pad{padding:18px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th{font-weight:500;color:var(--mute);font-size:12px;text-align:right;padding:8px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:8px;border-bottom:1px solid var(--soft2)}table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#f6f8fc}
.mb{position:relative;height:300px;display:grid;gap:12px;margin-top:8px}
.mb .ax{position:absolute;left:0;right:0;top:50%;border-top:1px solid #d9dce3}
.mb .col{position:relative;height:100%}
.mb .bar{position:absolute;left:14%;right:14%;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.mb .v{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;transition:opacity .4s .3s}
.mb .lb{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute)}
.ring{display:flex;align-items:center;gap:18px;padding:18px}
.ring circle.v{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.cmp{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--soft2)}
.cmp .tk{height:8px;background:var(--track);border-radius:4px;position:relative;overflow:hidden}.cmp .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.br{display:grid;grid-template-columns:96px 1fr 84px 44px 34px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.br .bt{height:8px;background:var(--track);border-radius:4px;position:relative;overflow:hidden}.br .bt i{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.br span:not(:first-child){text-align:right}
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}.heat .wk{display:grid;grid-template-rows:14px repeat(7,14px);gap:3px}
.heat .d{width:14px;height:14px;border-radius:3px;background:var(--soft2)}.heat .ml{font-size:10px;color:var(--mute);white-space:nowrap;height:14px}
.heat .dl{display:grid;grid-template-rows:14px repeat(7,14px);gap:3px;font-size:10px;color:var(--mute);margin-right:4px}
#eq{height:260px;position:relative}
.eqtip{display:none;position:absolute;z-index:5;pointer-events:none;background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.08);white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .mbx{background:#fff;border-radius:16px;padding:16px;max-width:560px;width:100%;max-height:96vh;display:flex;flex-direction:column;gap:12px;animation:rise .3s both}
#modal .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#modal select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
#modal img{width:100%;border-radius:10px;object-fit:contain;min-height:0;flex:1}
.empty{padding:40px;text-align:center;color:var(--mute)}
@media(max-width:900px){.c8,.c6,.c4{grid-column:span 12}header{padding:8px 16px}.wrap{padding:16px}.cmp{grid-template-columns:110px 1fr}.cmp>span:last-child{grid-column:span 2;text-align:left}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
